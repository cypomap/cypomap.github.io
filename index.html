<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyprus POTA Map</title>
    <!-- Version: 2026-08-31-1 -->

    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    />

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    /* Legend styling */
    .sota-marker {
        width: 0;
        height: 0;
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-bottom: 24px solid #777777; /* dark grey mountain */
    }
    
    .pota-legend {
        background: rgba(255, 255, 255, 0.9);
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 14px;
        line-height: 18px;
        box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
    
    .pota-legend h4 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: bold;
    }
    
    .pota-legend i {
        width: 14px;
        height: 14px;
        float: left;
        margin-right: 8px;
        opacity: 0.9;
        border-radius: 50%;
    }

    /* MOBILE-ONLY LAYOUT TWEAKS */
@media (max-width: 600px) {

    /* Shrink your custom unified control */
    .leaflet-control-custom,
    #potaControl {
        font-size: 14px;
        padding: 6px;
        max-width: 160px;
        line-height: 1.2;
    }

    /* Tighter checkboxes */
    #potaControl input[type="checkbox"] {
        transform: scale(0.9);
        margin-right: 4px;
    }

    /* Reduce spacing */
    #potaControl label,
    #potaControl button {
        margin: 3px 0;
    }

    /* Shrink legend */
    .pota-legend {
        font-size: 12px;
        padding: 4px;
        max-width: 140px;
        bottom: 10px;
        right: 10px;
    }

    /* Move attribution so it doesn't collide */
    .leaflet-control-attribution {
        bottom: 5px;
        left: 5px;
        right: auto;
    }

    /* Ensure popups appear above legend */
    .leaflet-popup {
        z-index: 10000;
    }
}

</style>

</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>

    <!-- Your map logic -->
    <script src="map.js?v=9999"></script>

</body>
</html>
