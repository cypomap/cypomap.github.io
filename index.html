<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyprus POTA Map</title>

    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    />

    <!-- Minimal inline CSS (since you have no style.css) -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Your marker CSS */
        .pota-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pota-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        /* Legend styling */
        .pota-legend {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 18px;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
        }
        
        .pota-legend h4 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: bold;
        }
        
        .pota-legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>

    <!-- Your map logic -->
    <script src="map.js"></script>

</body>
</html>
